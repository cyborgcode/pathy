name: Deploy to GitHub Pages

# Pages serves the app over HTTPS, which is what getUserMedia requires. That
# makes the deployed site the easiest way to actually use this: open it on two
# devices, no local server and no certificate exception on either of them.

on:
  push:
    branches:
      - main
      - master
      - claude/faster-transfer-higher-volume-bftc0e
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead of cancelling, so a run that is
# already publishing is allowed to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Typecheck and the full unit + transfer suite. The headless browser test
      # is not run here: it needs a Chromium download, and what it covers
      # (MediaStream plumbing) is not what a deploy can break.
      - run: npm test

      - name: Build
        env:
          # Project pages live under /<repo>/, not the domain root.
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - uses: actions/configure-pages@v5
        with:
          # Turn Pages on if it has never been enabled for this repository.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
