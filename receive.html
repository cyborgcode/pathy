<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Receive: frames are resolved from the camera and reassembled.">
<meta name="theme-color" content="#0a0a0a">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Photon">
<!-- black-translucent puts the page under the status bar, which is what
     viewport-fit=cover plus the safe-area padding in the stylesheet expects. -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta property="og:title" content="Photon &mdash; receive">
<meta property="og:description" content="Receive: frames are resolved from the camera and reassembled.">
<meta property="og:type" content="website">
<title>Photon &mdash; receive</title>
  <script type="module" crossorigin src="/pathy/assets/receive-BtTFT4c-.js"></script>
  <link rel="modulepreload" crossorigin href="/pathy/assets/pwa-ufipXdMk.js">
  <link rel="modulepreload" crossorigin href="/pathy/assets/sha256-DJ1hUrZF.js">
  <link rel="stylesheet" crossorigin href="/pathy/assets/pwa-C5X8wxHp.css">
</head>
<body>
<main class="wrap">
  <header>
    <h1>Receive</h1>
    <p class="ident">
      <span><b>Mode</b> RX</span>
      <span><b>Sink</b> memory</span>
      <span><a href="./">Index</a></span>
    </p>
  </header>

  <section class="panel">
    <div class="row">
      <button id="start">Start camera</button>
      <button id="stop" class="secondary" disabled>Stop</button>
    </div>
    <div class="row">
      <label><input type="checkbox" id="todisk"> Sink to disk</label>
    </div>
    <div class="msg" id="msg"></div>

    <details>
      <summary>Parameters</summary>
      <div class="grid">
        <div class="field">
          <label for="res">Capture</label>
          <select id="res">
            <option value="1920">1920 &middot; max density</option>
            <option value="1600" selected>1600</option>
            <option value="1280">1280 &middot; fastest</option>
          </select>
        </div>
        <div class="field">
          <label for="workers">Decode workers</label>
          <input type="number" id="workers" value="4" min="1" max="16">
        </div>
      </div>
    </details>
  </section>

  <video id="video" playsinline muted hidden></video>

  <section class="panel">
    <div class="stats">
      <div class="stat stat--wide"><span class="k">Payload</span><output class="v" id="r-name">&mdash;</output></div>
      <div class="stat"><span class="k">Resolved</span><output class="v" id="r-done">&mdash;</output></div>
      <div class="stat"><span class="k">RX rate</span><output class="v" id="r-rate">&mdash;</output></div>
      <div class="stat"><span class="k">Frames</span><output class="v" id="r-fps">&mdash;</output></div>
      <div class="stat"><span class="k">Lock</span><output class="v" id="r-hit">&mdash;</output></div>
    </div>
    <div class="bar"><i id="r-bar"></i></div>
    <div class="msg" id="r-msg"></div>
    <div class="row" id="r-actions" hidden><button id="save">Save file</button></div>
  </section>
</main>
</body>
</html>
