<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Point this camera at a sending screen to rebuild the file from light alone.">
<meta name="theme-color" content="#0a0b0d">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Photon">
<!-- black-translucent puts the page under the status bar, which is what
     viewport-fit=cover plus the safe-area padding in the stylesheet expects. -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta property="og:title" content="Photon — receive">
<meta property="og:description" content="Point this camera at a sending screen to rebuild the file from light alone.">
<meta property="og:type" content="website">
<title>Photon — receive</title>
<link rel="stylesheet" href="/src/ui/style.css">
</head>
<body>
<main class="wrap">
  <header>
  <h1>Receive</h1>
  <p class="sub"><a href="./">← back</a> · Point the camera at the sending screen. Fill the view with it and hold steady.</p>
  </header>

  <div class="panel">
    <div class="row">
      <button id="start">Start camera</button>
      <button id="stop" class="secondary" disabled>Stop</button>
      <label><input type="checkbox" id="todisk"> Stream straight to disk (large files)</label>
    </div>
    <div class="msg" id="msg"></div>

    <details style="margin-top:14px">
      <summary>Settings</summary>
      <div class="grid">
        <div class="field">
          <label for="res">Capture resolution</label>
          <select id="res">
            <option value="1920">1920 (best density)</option>
            <option value="1600" selected>1600</option>
            <option value="1280">1280 (fastest)</option>
          </select>
        </div>
        <div class="field">
          <label for="workers">Decode workers</label>
          <input type="number" id="workers" value="4" min="1" max="16">
        </div>
      </div>
    </details>
  </div>

  <video id="video" playsinline muted></video>

  <div class="panel" style="margin-top:16px">
    <div class="stats">
      <div class="stat"><div class="k">File</div><div class="v" id="r-name">—</div></div>
      <div class="stat"><div class="k">Received</div><div class="v" id="r-done">—</div></div>
      <div class="stat"><div class="k">Rate</div><div class="v" id="r-rate">—</div></div>
      <div class="stat"><div class="k">Frames/sec</div><div class="v" id="r-fps">—</div></div>
      <div class="stat"><div class="k">Decode hit</div><div class="v" id="r-hit">—</div></div>
    </div>
    <div class="bar"><i id="r-bar"></i></div>
    <div class="msg" id="r-msg"></div>
    <div class="row" id="r-actions" hidden><button id="save">Save file</button></div>
  </div>
</main>
<script type="module" src="/src/receiver/main.ts"></script>
</body>
</html>
